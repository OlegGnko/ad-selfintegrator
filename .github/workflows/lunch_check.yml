name: Daily Lunch Menu

on:
  schedule:
    # 11:00 Warsaw летом (CEST = UTC+2) → 09:00 UTC
    # Зимой (CET = UTC+1) смени на "0 10 * * 1-5"
    - cron: "0 9 * * 1-5"
  workflow_dispatch: # ручной запуск для теста

jobs:
  check-menus:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lunch_checker/requirements.txt

      - name: Install Python deps
        run: pip install -r lunch_checker/requirements.txt

      - name: Install Playwright browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run lunch checker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: |
          cd lunch_checker
          python main.py
