<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Digital — Generator Ofert Bitrix24</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Alpha Digital Design Tokens ── */
:root {
  --ad-black:        #111111;
  --ad-black-pure:   #000000;
  --ad-dark-gray:    #272727;
  --ad-mid-gray:     #404040;
  --ad-light-gray:   #C5C5C5;
  --ad-cream:        #FAF9F5;
  --ad-white:        #FFFFFF;
  --ad-lime:         #C2FF85;
  --ad-lime-light:   #F5FFEA;
  --ad-lime-rgb:     194, 255, 133;
  --ad-green:        #62C584;
  --ad-coral:        #F95D51;
  --ad-font:         'Inter', Arial, sans-serif;
  --ad-radius-sm:    8px;
  --ad-radius-md:    16px;
  --ad-radius-lg:    20px;
  --ad-radius-xl:    30px;
  --ad-radius-pill:  200px;
  --ad-shadow:       0 4px 24px rgba(0,0,0,0.08);
  --ad-shadow-dark:  0 4px 24px rgba(0,0,0,0.3);
  --ad-transition:   all 0.3s ease;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-font-smoothing: antialiased; }

body {
  font-family: var(--ad-font);
  background: var(--ad-black);
  color: var(--ad-white);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Top Bar ── */
.topbar {
  background: var(--ad-black-pure);
  border-bottom: 1px solid var(--ad-dark-gray);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 20;
}
.topbar-logo {
  font-size: 16px;
  font-weight: 700;
  color: var(--ad-lime);
  letter-spacing: -0.3px;
  text-transform: uppercase;
}
.topbar-sep { color: var(--ad-dark-gray); font-size: 18px; }
.topbar-sub { font-size: 13px; color: var(--ad-light-gray); }
.topbar-badge {
  margin-left: auto;
  background: var(--ad-dark-gray);
  color: var(--ad-lime);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 14px;
  border-radius: var(--ad-radius-pill);
  border: 1px solid rgba(194,255,133,0.2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* ── Stepper ── */
.stepper {
  background: var(--ad-dark-gray);
  border-bottom: 1px solid #333;
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.stepper::-webkit-scrollbar { display: none; }
.step {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 0;
  white-space: nowrap;
  flex-shrink: 0;
}
.step-dot {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #333;
  color: var(--ad-light-gray);
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: var(--ad-transition);
}
.step.active .step-dot { background: var(--ad-lime); color: var(--ad-black); }
.step.done .step-dot { background: var(--ad-green); color: var(--ad-black); }
.step-label {
  font-size: 11px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}
.step.active .step-label { color: var(--ad-lime); }
.step.done .step-label { color: var(--ad-green); }
.step-line {
  width: 24px;
  height: 1px;
  background: #333;
  margin: 0 8px;
  flex-shrink: 0;
}
.step.done .step-line { background: var(--ad-green); }

/* ── Chat Layout ── */
.chat-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  max-width: 800px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 0;
}

.messages {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding-bottom: 20px;
  overflow-y: auto;
  max-height: calc(100vh - 240px);
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 3px; }
.messages::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

/* ── Bubbles ── */
.msg {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  animation: fadeUp .22s ease;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg.user { flex-direction: row-reverse; }

.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  font-weight: 700;
}
.avatar.bot { background: var(--ad-lime); color: var(--ad-black); }
.avatar.user { background: var(--ad-dark-gray); color: var(--ad-light-gray); font-size: 15px; }

.bubble {
  max-width: 74%;
  padding: 12px 16px;
  font-size: 14px;
  line-height: 1.6;
}
.msg.bot .bubble {
  background: var(--ad-dark-gray);
  border-radius: var(--ad-radius-lg) var(--ad-radius-lg) var(--ad-radius-lg) 4px;
  color: var(--ad-white);
  border: 1px solid #333;
}
.msg.user .bubble {
  background: var(--ad-lime);
  color: var(--ad-black);
  border-radius: var(--ad-radius-lg) var(--ad-radius-lg) 4px var(--ad-radius-lg);
  font-weight: 500;
}
.bubble strong { font-weight: 600; }

/* ── Company Card ── */
.company-card {
  background: var(--ad-black);
  border: 1px solid rgba(194,255,133,0.25);
  border-radius: var(--ad-radius-md);
  padding: 14px 16px;
  margin-top: 10px;
  font-size: 13px;
}
.company-card .c-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(194,255,133,0.12);
  color: var(--ad-lime);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--ad-radius-pill);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.company-card .c-name {
  font-size: 15px; font-weight: 700; color: var(--ad-white); margin-bottom: 8px;
}
.company-card .c-row {
  display: flex; gap: 8px; color: var(--ad-light-gray); margin-bottom: 4px;
  font-size: 12px;
}
.company-card .c-label {
  color: #555;
  min-width: 65px;
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding-top: 1px;
}

/* ── Download Panel ── */
.download-panel {
  background: var(--ad-black);
  border: 1px solid #333;
  border-radius: var(--ad-radius-xl);
  padding: 20px;
  margin-top: 12px;
}
.download-panel h4 {
  font-size: 11px;
  font-weight: 700;
  color: var(--ad-light-gray);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 14px;
}
.download-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #1e1e1e;
}
.download-row:last-child { border-bottom: none; padding-bottom: 0; }
.download-row .doc-icon { font-size: 22px; flex-shrink: 0; }
.download-row .doc-name {
  flex: 1;
  font-size: 13px;
  color: var(--ad-white);
  font-weight: 500;
}
.download-row .doc-sub { font-size: 11px; color: #555; margin-top: 1px; }

/* ── Buttons ── */
.ad-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--ad-font);
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  border-radius: var(--ad-radius-pill);
  padding: 9px 20px;
  text-decoration: none;
  transition: var(--ad-transition);
  white-space: nowrap;
}
.ad-btn-primary {
  background: var(--ad-black-pure);
  color: var(--ad-lime);
  border: 1px solid rgba(194,255,133,0.3);
}
.ad-btn-primary:hover {
  background: var(--ad-dark-gray);
  border-color: var(--ad-lime);
  transform: translateY(-1px);
}
.ad-btn-lime {
  background: var(--ad-lime);
  color: var(--ad-black);
  font-weight: 600;
}
.ad-btn-lime:hover {
  background: #d4ff9f;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(194,255,133,0.25);
}

/* ── Typing Indicator ── */
.typing {
  display: flex; gap: 4px; padding: 6px 2px;
  align-items: center;
}
.typing span {
  width: 6px; height: 6px;
  background: var(--ad-light-gray);
  border-radius: 50%;
  animation: bounce 1.1s infinite;
}
.typing span:nth-child(2) { animation-delay: .18s; }
.typing span:nth-child(3) { animation-delay: .36s; }
@keyframes bounce {
  0%,80%,100% { transform: translateY(0); opacity: .5; }
  40% { transform: translateY(-5px); opacity: 1; }
}

/* ── Input Area ── */
.input-area {
  background: var(--ad-black-pure);
  border-top: 1px solid var(--ad-dark-gray);
  padding: 14px 20px;
  display: flex;
  gap: 10px;
  align-items: flex-end;
  position: sticky;
  bottom: 0;
  width: 100%;
  max-width: 800px;
  align-self: center;
}
.input-wrap {
  flex: 1;
  border: 1px solid #333;
  border-radius: var(--ad-radius-pill);
  display: flex;
  align-items: flex-end;
  background: var(--ad-dark-gray);
  transition: border-color .2s;
  overflow: hidden;
}
.input-wrap:focus-within {
  border-color: rgba(194,255,133,0.5);
  box-shadow: 0 0 0 3px rgba(194,255,133,0.07);
}
textarea {
  flex: 1;
  border: none;
  outline: none;
  resize: none;
  padding: 12px 18px;
  font-size: 14px;
  font-family: var(--ad-font);
  color: var(--ad-white);
  max-height: 120px;
  line-height: 1.5;
  background: transparent;
}
textarea::placeholder { color: #555; }
.send-btn {
  width: 44px; height: 44px;
  background: var(--ad-lime);
  border: none;
  border-radius: var(--ad-radius-pill);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: var(--ad-transition);
  margin: 0 3px 3px 0;
}
.send-btn:hover { background: #d4ff9f; transform: scale(1.05); }
.send-btn:disabled { background: #333; cursor: not-allowed; transform: none; }
.send-btn svg { width: 18px; height: 18px; }

/* ── Mic button ── */
.mic-btn {
  width: 44px; height: 44px;
  background: var(--ad-dark-gray);
  border: 1px solid #333;
  border-radius: var(--ad-radius-pill);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: var(--ad-transition);
}
.mic-btn:hover { border-color: var(--ad-lime); }
.mic-btn svg { width: 18px; height: 18px; }
.mic-btn.recording {
  background: #3a1a1a;
  border-color: #F95D51;
  animation: pulse-red 1s infinite;
}
.mic-btn.recording svg { stroke: #F95D51; }
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 0 0 rgba(249,93,81,0.4); }
  50%       { box-shadow: 0 0 0 6px rgba(249,93,81,0); }
}

/* ── Announcement bar ── */
.status-bar {
  background: rgba(194,255,133,0.08);
  border-bottom: 1px solid rgba(194,255,133,0.12);
  padding: 8px 24px;
  font-size: 12px;
  color: var(--ad-lime);
  text-align: center;
  letter-spacing: 0.3px;
  display: none;
}
.status-bar.show { display: block; }

/* ── Manager bar ── */
.manager-bar {
  background: var(--ad-black-pure);
  border-top: 1px solid #1a1a1a;
  padding: 8px 20px;
  display: none;
  justify-content: center;
  align-items: center;
  gap: 10px;
}
.manager-bar.show { display: flex; }
.manager-bar .mgr-btn {
  background: var(--ad-dark-gray);
  color: var(--ad-lime);
  border: 1px solid rgba(194,255,133,0.25);
  border-radius: var(--ad-radius-pill);
  padding: 9px 22px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--ad-font);
  transition: var(--ad-transition);
  display: flex;
  align-items: center;
  gap: 7px;
}
.manager-bar .mgr-btn:hover {
  background: #2a2a2a;
  border-color: var(--ad-lime);
}
.manager-bar .mgr-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.manager-bar .mgr-note {
  font-size: 11px;
  color: #555;
}

@media (max-width: 600px) {
  .bubble { max-width: 86%; }
  .step-label { display: none; }
  .chat-wrap { padding: 16px 12px 0; }
}
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-logo">Alpha Digital</div>
  <div class="topbar-sep">|</div>
  <div class="topbar-sub">Generator ofert Bitrix24</div>
  <div class="topbar-badge" id="stateBadge">Start</div>
</div>

<!-- Status bar -->
<div class="status-bar" id="statusBar"></div>

<!-- Stepper -->
<div class="stepper" id="stepper">
  <div class="step active" data-step="1">
    <div class="step-dot">1</div>
    <span class="step-label">Dane firmy</span>
    <div class="step-line"></div>
  </div>
  <div class="step" data-step="2">
    <div class="step-dot">2</div>
    <span class="step-label">Weryfikacja</span>
    <div class="step-line"></div>
  </div>
  <div class="step" data-step="3">
    <div class="step-dot">3</div>
    <span class="step-label">Wywiad</span>
    <div class="step-line"></div>
  </div>
  <div class="step" data-step="4">
    <div class="step-dot">4</div>
    <span class="step-label">Oferta</span>
    <div class="step-line"></div>
  </div>
  <div class="step" data-step="5">
    <div class="step-dot">5</div>
    <span class="step-label">Umowa</span>
  </div>
</div>

<!-- Chat -->
<div class="chat-wrap">
  <div class="messages" id="messages"></div>
</div>

<!-- Manager bar (hidden until deal is created) -->
<div class="manager-bar" id="managerBar">
  <button class="mgr-btn" id="callManagerBtn">
    📞 <span id="callManagerLabel">Zadzwoń do managera</span>
  </button>
  <span class="mgr-note" id="managerNote"></span>
</div>

<!-- Input -->
<div class="input-area">
  <button class="mic-btn" id="micBtn" title="Nagraj głosem">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--ad-light-gray)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="2" width="6" height="11" rx="3"></rect>
      <path d="M19 10a7 7 0 0 1-14 0"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
  </button>
  <div class="input-wrap">
    <textarea id="input" placeholder="Wpisz wiadomość lub naciśnij mikrofon…" rows="1"></textarea>
  </div>
  <button class="send-btn" id="sendBtn" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  </button>
</div>

<script>
  const messagesEl      = document.getElementById('messages');
  const inputEl         = document.getElementById('input');
  const sendBtn         = document.getElementById('sendBtn');
  const stateBadge      = document.getElementById('stateBadge');
  const statusBar       = document.getElementById('statusBar');
  const managerBar      = document.getElementById('managerBar');
  const callManagerBtn  = document.getElementById('callManagerBtn');
  const callManagerLabel= document.getElementById('callManagerLabel');
  const managerNote     = document.getElementById('managerNote');

  let sessionId  = null;
  let isLoading  = false;
  let currentLang = 'pl';  // default; updated when Claude calls set_language

  // ── Translations for UI chrome ────────────────────────────────────────────
  const UI_T = {
    pl: {
      callMgr:    'Zadzwoń do managera',
      callSent:   'Zapytanie przekazane! Manager odezwie się wkrótce.',
      callError:  'Błąd. Napisz na info@alphadigital.pl',
      inputPh:    'Wpisz wiadomość lub naciśnij mikrofon…',
    },
    en: {
      callMgr:    'Talk to a manager',
      callSent:   'Request sent! A manager will contact you shortly.',
      callError:  'Error. Please email info@alphadigital.pl',
      inputPh:    'Type a message or press the mic…',
    },
    ru: {
      callMgr:    'Связаться с менеджером',
      callSent:   'Запрос отправлен! Менеджер свяжется с вами.',
      callError:  'Ошибка. Напишите на info@alphadigital.pl',
      inputPh:    'Введите сообщение или нажмите микрофон…',
    },
  };

  const MIC_LANG = { pl: 'pl-PL', en: 'en-US', ru: 'ru-RU' };

  function applyLanguage(lang) {
    if (!UI_T[lang]) return;
    currentLang = lang;
    callManagerLabel.textContent = UI_T[lang].callMgr;
    inputEl.placeholder = UI_T[lang].inputPh;
    if (recognition) recognition.lang = MIC_LANG[lang] || 'pl-PL';
  }

  const STATE_LABELS = {
    collect_user_info: 'Dane kontaktowe',
    confirm_company:   'Weryfikacja firmy',
    interview:         'Wywiad CRM',
    proposal_ready:    'Oferta gotowa',
    revisions:         'Korekty',
    contract_ready:    'Umowa gotowa',
  };

  const STATE_STEPS = {
    collect_user_info: 1,
    confirm_company:   2,
    interview:         3,
    proposal_ready:    4,
    revisions:         4,
    contract_ready:    5,
  };

  // ── Session link banner ───────────────────────────────────────────────────
  function showSessionLink(id) {
    const existing = document.getElementById('sessionLinkBar');
    if (existing) return;

    const bar = document.createElement('div');
    bar.id = 'sessionLinkBar';
    bar.style.cssText = `
      background:#1a1a1a; border:1px solid #2a2a2a; border-radius:10px;
      padding:10px 14px; margin-bottom:10px; display:flex; align-items:center;
      gap:10px; font-size:12px; color:#888;
    `;
    const url = `${location.origin}${location.pathname}?session=${id}`;
    bar.innerHTML = `
      <span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
        🔗 <span style="color:#ccc">${url}</span>
      </span>
      <button id="copyLinkBtn" style="
        background:#C2FF85; color:#111; border:none; border-radius:6px;
        padding:4px 10px; font-size:11px; font-weight:600; cursor:pointer; white-space:nowrap;
      ">Kopiuj link</button>
    `;
    messagesEl.parentElement.insertBefore(bar, messagesEl);

    document.getElementById('copyLinkBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copyLinkBtn');
        btn.textContent = '✓ Skopiowano';
        setTimeout(() => { btn.textContent = 'Kopiuj link'; }, 2000);
      });
    });
  }

  function setUrlSession(id) {
    const url = new URL(location.href);
    url.searchParams.set('session', id);
    history.replaceState(null, '', url.toString());
  }

  async function init() {
    const params = new URLSearchParams(location.search);
    const existingId = params.get('session');

    if (existingId) {
      // Try to resume an existing session
      try {
        const res = await fetch(`/api/session/${existingId}`);
        if (res.ok) {
          const data = await res.json();
          sessionId = existingId;
          // Restore language
          if (data.language) applyLanguage(data.language);
          // Replay messages into chat UI
          for (const m of data.messages) {
            if (m.role === 'assistant') addBotMessage(m.content);
            else addUserMessage(m.content);
          }
          // Restore download panel if needed
          if (['proposal_ready','revisions','contract_ready'].includes(data.state)) {
            const last = messagesEl.querySelector('.msg.bot:last-child .bubble');
            if (last && !last.querySelector('.download-panel')) {
              last.appendChild(buildDownloadPanel(data.state === 'contract_ready'));
            }
          }
          // Restore manager bar if deal was created (interview stage or later)
          if (['interview','proposal_ready','revisions','contract_ready'].includes(data.state)) {
            managerBar.classList.add('show');
          }
          updateStepper(data.state);
          showSessionLink(sessionId);
          sendBtn.disabled = false;
          return;
        }
      } catch (_) {}
      // If session not found, fall through to start a new one
    }

    // Start fresh session
    const res = await fetch('/api/session/start', { method: 'POST' });
    const data = await res.json();
    sessionId = data.session_id;
    setUrlSession(sessionId);
    showSessionLink(sessionId);
    addBotMessage(data.message);
    addLanguageButtons();   // show PL / EN / RU buttons on fresh session
    sendBtn.disabled = false;
  }

  function addLanguageButtons() {
    if (document.getElementById('langButtons')) return; // already shown
    const wrap = document.createElement('div');
    wrap.id = 'langButtons';
    wrap.style.cssText = [
      'display:flex', 'gap:10px', 'justify-content:center',
      'flex-wrap:wrap', 'padding:4px 0 16px',
    ].join(';');

    const opts = [
      { label: '🇵🇱  Polski',   msg: 'Polski'  },
      { label: '🇬🇧  English',  msg: 'English' },
      { label: '🇷🇺  Русский',  msg: 'Русский' },
    ];

    opts.forEach(({ label, msg }) => {
      const btn = document.createElement('button');
      btn.className = 'ad-btn ad-btn-primary';
      btn.textContent = label;
      btn.style.cssText = 'font-size:15px;padding:11px 30px;letter-spacing:0.2px;';
      btn.addEventListener('click', () => {
        document.getElementById('langButtons')?.remove();
        // Put the choice in the input and send it
        inputEl.value = msg;
        sendMessage();
      });
      wrap.appendChild(btn);
    });

    messagesEl.appendChild(wrap);
    scrollBottom();
  }

  function addBotMessage(text, extras = {}) {
    const msg = document.createElement('div');
    msg.className = 'msg bot';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'AD';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = formatText(text);

    if (extras.company) bubble.appendChild(buildCompanyCard(extras.company));
    if (extras.showProposal) bubble.appendChild(buildDownloadPanel(extras.contractReady));

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function addUserMessage(text) {
    const msg = document.createElement('div');
    msg.className = 'msg user';

    const avatar = document.createElement('div');
    avatar.className = 'avatar user';
    avatar.textContent = '↑';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'AD';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  function formatText(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }

  function buildCompanyCard(company) {
    const card = document.createElement('div');
    card.className = 'company-card';
    card.innerHTML = `
      <div class="c-badge">✓ Znaleziono w rejestrze</div>
      <div class="c-name">${company.name || '—'}</div>
      <div class="c-row"><span class="c-label">NIP</span>${company.nip || '—'}</div>
      ${company.regon ? `<div class="c-row"><span class="c-label">REGON</span>${company.regon}</div>` : ''}
      ${company.address ? `<div class="c-row"><span class="c-label">Adres</span>${company.address}</div>` : ''}
      ${company.vat_status ? `<div class="c-row"><span class="c-label">VAT</span>${company.vat_status}</div>` : ''}
    `;
    return card;
  }

  function buildDownloadPanel(contractReady = false) {
    const panel = document.createElement('div');
    panel.className = 'download-panel';
    panel.innerHTML = `<h4>Dokumenty gotowe do pobrania</h4>`;

    const proposalRow = document.createElement('div');
    proposalRow.className = 'download-row';
    proposalRow.innerHTML = `
      <div class="doc-icon">📋</div>
      <div>
        <div class="doc-name">Oferta handlowa</div>
        <div class="doc-sub">PDF · Bitrix24 CRM</div>
      </div>
    `;
    const proposalBtn = document.createElement('a');
    proposalBtn.href = `/api/session/${sessionId}/proposal.pdf`;
    proposalBtn.target = '_blank';
    proposalBtn.className = 'ad-btn ad-btn-primary';
    proposalBtn.innerHTML = '↓ Pobierz';
    proposalRow.appendChild(proposalBtn);
    panel.appendChild(proposalRow);

    if (contractReady) {
      const contractRow = document.createElement('div');
      contractRow.className = 'download-row';
      contractRow.innerHTML = `
        <div class="doc-icon">📝</div>
        <div>
          <div class="doc-name">Umowa o świadczenie usług</div>
          <div class="doc-sub">PDF · gotowa do podpisu</div>
        </div>
      `;
      const contractBtn = document.createElement('a');
      contractBtn.href = `/api/session/${sessionId}/contract.pdf`;
      contractBtn.target = '_blank';
      contractBtn.className = 'ad-btn ad-btn-lime';
      contractBtn.innerHTML = '↓ Pobierz';
      contractRow.appendChild(contractBtn);
      panel.appendChild(contractRow);
    }

    return panel;
  }

  function updateStepper(state) {
    const currentStep = STATE_STEPS[state] || 1;
    const label = STATE_LABELS[state] || state;
    stateBadge.textContent = label;

    document.querySelectorAll('.step').forEach(el => {
      const n = parseInt(el.dataset.step);
      el.classList.remove('active', 'done');
      if (n < currentStep) el.classList.add('done');
      else if (n === currentStep) el.classList.add('active');
    });

    if (state === 'proposal_ready' || state === 'contract_ready') {
      statusBar.textContent = state === 'contract_ready'
        ? '✓ Umowa gotowa — pobierz i podpisz'
        : '✓ Oferta gotowa — sprawdź i pobierz PDF';
      statusBar.classList.add('show');
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading || !sessionId) return;

    addUserMessage(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    isLoading = true;
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(`/api/session/${sessionId}/message`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      const data = await res.json();
      removeTyping();

      const actions = data.actions || [];
      const companyAction   = actions.find(a => a.type === 'company_found');
      const proposalReady   = actions.some(a => ['proposal_ready','proposal_updated'].includes(a.type));
      const contractReady   = actions.some(a => a.type === 'contract_ready');
      const dealCreated     = actions.some(a => a.deal_created);
      const langSetAction   = actions.find(a => a.type === 'language_set');

      // Apply language if changed
      const responseLang = data.language || '';
      if (responseLang && responseLang !== currentLang) {
        applyLanguage(responseLang);
      }

      // Show Call Manager bar once deal is created
      if (dealCreated) {
        managerBar.classList.add('show');
      }

      const extras = {};
      if (companyAction) extras.company = companyAction.company;
      if (proposalReady || contractReady ||
          ['proposal_ready','revisions','contract_ready'].includes(data.state)) {
        extras.showProposal = true;
        extras.contractReady = contractReady || data.state === 'contract_ready';
      }

      if (data.message) addBotMessage(data.message, extras);
      else if (extras.showProposal) addBotMessage('', extras);

      updateStepper(data.state);

    } catch (err) {
      removeTyping();
      addBotMessage('Wystąpił błąd połączenia. Spróbuj ponownie.');
    }

    isLoading = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ── Call Manager button ───────────────────────────────────────────────────
  callManagerBtn.addEventListener('click', async () => {
    if (!sessionId) return;
    callManagerBtn.disabled = true;
    managerNote.textContent = '';
    try {
      const res  = await fetch(`/api/session/${sessionId}/request-manager`, { method: 'POST' });
      const data = await res.json();
      const t = UI_T[currentLang] || UI_T.pl;
      managerNote.textContent = data.success ? t.callSent : t.callError;
      managerNote.style.color = data.success ? 'var(--ad-lime)' : 'var(--ad-coral)';
      if (data.success) {
        // Keep button disabled for 60s to prevent spam
        setTimeout(() => {
          callManagerBtn.disabled = false;
          managerNote.textContent  = '';
        }, 60000);
      } else {
        callManagerBtn.disabled = false;
      }
    } catch (e) {
      const t = UI_T[currentLang] || UI_T.pl;
      managerNote.textContent = t.callError;
      managerNote.style.color = 'var(--ad-coral)';
      callManagerBtn.disabled = false;
    }
  });

  // ── Voice input ────────────────────────────────────────────────────────────
  const micBtn = document.getElementById('micBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  let recognition = null;  // declared here so applyLanguage() can access it

  if (!SpeechRecognition) {
    micBtn.style.display = 'none';
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'pl-PL';
    recognition.continuous = true;      // keep recording through pauses
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    let isRecording = false;
    let interimSpan = '';

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.title = 'Zatrzymaj nagrywanie';
    };

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const t = event.results[i][0].transcript;
        if (event.results[i].isFinal) final += t;
        else interim += t;
      }
      if (final) {
        const cur = inputEl.value;
        inputEl.value = (cur ? cur + ' ' : '') + final.trim();
        interimSpan = '';
      } else {
        interimSpan = interim;
      }
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
      sendBtn.disabled = inputEl.value.trim().length === 0;
    };

    recognition.onend = () => {
      // If user hasn't pressed stop — restart automatically (browser cut off on silence)
      if (isRecording) {
        try { recognition.start(); } catch (e) { /* already starting */ }
        return;
      }
      micBtn.classList.remove('recording');
      micBtn.title = 'Nagraj głosem';
      interimSpan = '';
    };

    recognition.onerror = (event) => {
      if (event.error === 'no-speech') return; // ignore silence, keep going
      console.warn('SpeechRecognition error:', event.error);
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.title = 'Nagraj głosem';
    };

    micBtn.addEventListener('click', () => {
      if (isRecording) {
        isRecording = false;   // mark as stopped BEFORE calling stop()
        recognition.stop();
      } else {
        inputEl.focus();
        recognition.start();
      }
    });
  }

  init();
</script>
</body>
</html>
